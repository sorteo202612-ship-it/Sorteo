<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo secreto de Navidad</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--text:#2b2b2b;--muted:#6b6b6b;--red:#c62828;--green:#2e7d32;--line:#e6d9cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1412;--card:#271d1a;--text:#f3ece6;--muted:#b3a59a;--red:#ef5350;--green:#66bb6a;--line:#3d2f2a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;text-align:center;margin:8px 0 4px}
h3{margin:0 0 4px}
.sub{text-align:center;color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--text)}
textarea{min-height:80px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--red);color:#fff;font-weight:600;width:100%;margin-top:12px}
button.sec{background:transparent;color:var(--muted);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.hint{font-size:.85rem;color:var(--muted)}
.msg{font-size:.9rem;margin:8px 0 0}
.err{color:var(--red)}.ok{color:var(--green)}
.big{font-size:2rem;text-align:center;font-weight:700;color:var(--green);margin:8px 0}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;justify-content:center}
.imgs img{width:46%;max-width:200px;border-radius:10px;border:1px solid var(--line)}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px;font-size:.9rem}
.likes{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;margin-top:6px}
[hidden]{display:none!important}
summary{cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>🎄 Amigo secreto 🎁</h1>
<p class="sub">Presupuesto: $10 por regalo</p>

<div class="card">
  <strong id="estado">Cargando…</strong>
  <div id="nombres"></div>
</div>

<div class="card" id="reg" hidden>
  <h3>Inscríbete</h3>
  <p class="hint">Elige un PIN de 4 a 6 números. Lo necesitarás para ver a quién te tocó y para editar tus datos.</p>
  <label for="n1">Tu nombre</label><input id="n1" type="text" maxlength="40" autocomplete="off">
  <label for="p1">Tu PIN</label><input id="p1" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
  <label for="g1">¿Qué te gusta? (ideas para un regalo de $10)</label>
  <textarea id="g1" maxlength="500" placeholder="Colores, dulces, series, hobbies, tallas…"></textarea>
  <label for="f1">Collage de ideas (opcional, hasta 2 fotos)</label>
  <input id="f1" type="file" accept="image/*" multiple>
  <div class="imgs" id="prev"></div>
  <button id="bReg">Inscribirme</button>
  <p class="msg" id="mReg"></p>
</div>

<div class="card">
  <h3>Ver a quién me tocó</h3>
  <label for="n2">Tu nombre</label><input id="n2" type="text" maxlength="40" autocomplete="off">
  <label for="p2">Tu PIN</label><input id="p2" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
  <button id="bRes">Ver mi amigo secreto</button>
  <p class="msg" id="mRes"></p>
  <div id="res" hidden>
    <p class="hint" style="text-align:center">Tu amigo secreto es:</p>
    <div class="big" id="rNombre"></div>
    <div id="rGustos"></div>
    <div class="imgs" id="rFotos"></div>
    <button class="sec" id="bHide">Ocultar</button>
  </div>
</div>

<details class="card">
  <summary>Soy el organizador</summary>
  <label for="ck">Clave de organizador</label><input id="ck" type="password" autocomplete="off">
  <label for="nn">Número de participantes</label><input id="nn" type="number" min="3" value="6">
  <button id="bCfg">Crear o actualizar sorteo</button>
  <button id="bCerrar" class="sec">Cerrar inscripciones y sortear ahora</button>
  <button id="bReset" class="sec">Reiniciar todo</button>
  <p class="msg" id="mOrg"></p>
</details>
</main>

<script>
// ====== PEGA AQUÍ TUS DATOS DE SUPABASE (Project Settings > API) ======
var SUPABASE_URL = "https://TU-PROYECTO.supabase.co";
var SUPABASE_KEY = "TU-CLAVE-ANON-O-PUBLISHABLE";
// =====================================================================

var $ = function(id){ return document.getElementById(id); };
var imgs = [];

function rpc(fn, args){
  var h = {"apikey": SUPABASE_KEY, "Content-Type": "application/json"};
  if (SUPABASE_KEY.indexOf("eyJ") === 0) h["Authorization"] = "Bearer " + SUPABASE_KEY;
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {method: "POST", headers: h, body: JSON.stringify(args || {})})
    .then(function(r){ return r.json().then(function(j){
      if (!r.ok) throw new Error(j.message || "Error de conexión");
      return j;
    }); });
}
function msg(id, text, ok){ var e = $(id); e.textContent = text || ""; e.className = "msg " + (ok ? "ok" : "err"); }
function run(btn, mid, fn){
  btn.disabled = true; msg(mid, "");
  return fn().catch(function(e){ msg(mid, e.message, false); }).then(function(){ btn.disabled = false; });
}

function paint(s){
  $("estado").textContent = !s.configurado
    ? "El organizador aún no ha preparado el sorteo."
    : "Inscritos: " + s.total + " de " + s.esperados + (s.sorteado ? " · ¡Sorteo realizado!" : "");
  var box = $("nombres"); box.innerHTML = "";
  (s.nombres || []).forEach(function(n){ var p = document.createElement("span"); p.className = "pill"; p.textContent = n; box.appendChild(p); });
  $("reg").hidden = !(s.configurado && !s.sorteado);
}
function refresh(){ return rpc("sorteo_estado").then(paint).catch(function(e){ $("estado").textContent = "No se pudo conectar: " + e.message; }); }

function shrink(file){
  return new Promise(function(res){
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(1, 300 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.55));
    };
    img.onerror = function(){ res(null); };
    img.src = u;
  });
}
function fillImgs(box, list){
  box.innerHTML = "";
  (list || []).forEach(function(src){
    if (typeof src === "string" && src.indexOf("data:image/") === 0){
      var im = document.createElement("img"); im.src = src; im.alt = "Idea de regalo"; box.appendChild(im);
    }
  });
}

$("f1").onchange = async function(){
  var files = Array.prototype.slice.call($("f1").files).slice(0, 2), out = [];
  for (var i = 0; i < files.length; i++){ var d = await shrink(files[i]); if (d) out.push(d); }
  imgs = out; fillImgs($("prev"), imgs);
};

$("bReg").onclick = function(){
  var b = $("bReg");
  run(b, "mReg", function(){
    return rpc("sorteo_inscribir", {p_nombre: $("n1").value, p_pin: $("p1").value, p_gustos: $("g1").value, p_fotos: imgs})
      .then(function(s){
        paint(s);
        $("n2").value = $("n1").value;
        try { localStorage.setItem("sorteo-nombre", $("n1").value.trim()); } catch(e){}
        msg("mReg", "¡Listo! Quedaste inscrito. Cuando se complete el grupo vuelve a este enlace para ver a quién te tocó.", true);
      });
  });
};

$("bRes").onclick = function(){
  var b = $("bRes");
  run(b, "mRes", function(){
    return rpc("sorteo_resultado", {p_nombre: $("n2").value, p_pin: $("p2").value}).then(function(r){
      if (!r.sorteado){ msg("mRes", "Aún no se hace el sorteo. Se hará cuando se inscriban todos.", true); return; }
      $("rNombre").textContent = r.nombre;
      var g = $("rGustos"); g.innerHTML = "";
      if (r.gustos){
        var h = document.createElement("p"); h.className = "hint"; h.textContent = "Le gusta:"; g.appendChild(h);
        var l = document.createElement("div"); l.className = "likes"; l.textContent = r.gustos; g.appendChild(l);
      } else if (!r.fotos || !r.fotos.length){
        var q = document.createElement("p"); q.className = "hint"; q.textContent = "No dejó gustos. ¡Sorpréndelo!"; g.appendChild(q);
      }
      fillImgs($("rFotos"), r.fotos);
      $("res").hidden = false; $("bRes").hidden = true;
    });
  });
};
$("bHide").onclick = function(){ $("res").hidden = true; $("bRes").hidden = false; $("p2").value = ""; };

$("bCfg").onclick = function(){ run($("bCfg"), "mOrg", function(){
  return rpc("sorteo_configurar", {p_clave: $("ck").value, p_n: parseInt($("nn").value, 10) || 0})
    .then(function(s){ paint(s); msg("mOrg", "Sorteo configurado para " + s.esperados + " personas.", true); });
}); };
$("bCerrar").onclick = function(){
  if (!confirm("Se sorteará con las personas inscritas hasta ahora. ¿Seguro?")) return;
  run($("bCerrar"), "mOrg", function(){
    return rpc("sorteo_cerrar", {p_clave: $("ck").value}).then(function(s){ paint(s); msg("mOrg", s.sorteado ? "Sorteo realizado." : "Faltan inscritos (mínimo 3).", s.sorteado); });
  });
};
$("bReset").onclick = function(){
  if (!confirm("Esto borra a todos los inscritos y el sorteo. ¿Seguro?")) return;
  run($("bReset"), "mOrg", function(){
    return rpc("sorteo_reiniciar", {p_clave: $("ck").value}).then(function(s){ paint(s); msg("mOrg", "Todo reiniciado.", true); });
  });
};

try { var gn = localStorage.getItem("sorteo-nombre"); if (gn){ $("n1").value = gn; $("n2").value = gn; } } catch(e){}
refresh();
setInterval(function(){ if (!document.hidden) refresh(); }, 20000);
</script>
</body>
</html>
